       <div class="intro_header">简介</div>
        <div class="intro_content">
            《革象新书》是元代天文学家赵友钦所著的代表性著作，全面汇集古代天文观测、测量与理论思考。
            本网站以此为基础，围绕“数形同辉”“斗转星移”“光行影迹”三大主题展开，系统呈现古人如何通过勾股之法与仪器测量探求天体奥秘，如何观察星辰运行揭示宇宙秩序，以及如何以日影、月相理解时间与自然的联系。
            通过数字交互、动态可视化等方式，我们力图还原赵友钦以实证精神革新象数体系的科学探索，让现代观众更直观地领略传统天文学的智慧。
        </div>
